<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Katalog součástek – AI & GitHub</title>

  <!-- Favicon + ikona integrovaného obvodu (IC) přímo v HTML -->
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Cg stroke='%2394a3b8' stroke-width='3' stroke-linecap='round'%3E%3Cline x1='20' y1='6' x2='20' y2='14'/%3E%3Cline x1='32' y1='6' x2='32' y2='14'/%3E%3Cline x1='44' y1='6' x2='44' y2='14'/%3E%3Cline x1='20' y1='50' x2='20' y2='58'/%3E%3Cline x1='32' y1='50' x2='32' y2='58'/%3E%3Cline x1='44' y1='50' x2='44' y2='58'/%3E%3Cline x1='6' y1='20' x2='14' y2='20'/%3E%3Cline x1='6' y1='32' x2='14' y2='32'/%3E%3Cline x1='6' y1='44' x2='14' y2='44'/%3E%3Cline x1='50' y1='20' x2='58' y2='20'/%3E%3Cline x1='50' y1='32' x2='58' y2='32'/%3E%3Cline x1='50' y1='44' x2='58' y2='44'/%3E%3C/g%3E%3Crect x='14' y='14' width='36' height='36' rx='6' fill='%231e293b' stroke='%2338bdf8' stroke-width='3'/%3E%3Crect x='23' y='23' width='18' height='18' rx='3' fill='%230b1220' stroke='%2322c55e' stroke-width='2'/%3E%3Ccircle cx='20' cy='20' r='2.2' fill='%2338bdf8'/%3E%3C/svg%3E"
  />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="manifest" href="manifest.json" />

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #0b1220;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    header h1 { font-size: 1.05rem; margin: 0; }
    nav { display: flex; gap: 6px; }
    button, .btn-file {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.92rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin: 0;
      user-select: none;
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    button.sm {
      padding: 6px 10px;
      font-size: 0.82rem;
    }
    button:hover:not(:disabled), .btn-file:hover { border-color: var(--accent); }
    button.primary, .btn-file.primary {
      background: var(--accent);
      color: #062033;
      border: none;
      font-weight: 600;
    }
    button.success {
      background: var(--accent-2);
      color: #052e16;
      border: none;
      font-weight: 600;
    }
    button.warn {
      background: rgba(245, 158, 11, 0.18);
      color: #fcd34d;
      border-color: rgba(245, 158, 11, 0.5);
      font-weight: 600;
    }
    button.danger {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.4);
    }
    button.active {
      outline: 2px solid var(--accent);
    }
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 16px;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .manual-ai-box {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .dup-alert {
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.5);
      color: #fde68a;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 0.9rem;
    }
    .dup-candidates {
      margin-top: 6px;
      font-size: 0.84rem;
      color: #fcd34d;
    }
    label.field-label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 10px;
      margin-bottom: 4px;
    }
    input, select, textarea {
      width: 100%;
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 0.95rem;
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 150px; }
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .preview-card {
      position: relative;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px;
    }
    .preview-card img {
      width: 100%;
      height: 125px;
      object-fit: cover;
      border-radius: 7px;
      display: block;
    }
    .preview-caption {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 5px;
      text-align: center;
    }
    .remove-photo-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 26px;
      height: 26px;
      padding: 0;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.88);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.65);
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1;
    }
    pre.pinout {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      overflow-x: auto;
      font-size: 0.85rem;
      white-space: pre-wrap;
    }
    .params-text {
      white-space: pre-line;
      margin-top: 4px;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .item-actions {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .cat-path {
      display: inline-block;
      font-size: 0.78rem;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 6px;
    }
    .repl-badge {
      display: inline-block;
      font-size: 0.76rem;
      background: rgba(34, 197, 94, 0.16);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.45);
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 6px;
      margin-left: 4px;
      font-weight: 600;
    }
    .repl-box {
      margin-top: 6px;
      color: #bae6fd;
      border-radius: 8px;
    }
    .repl-box.highlighted {
      background: rgba(34, 197, 94, 0.14);
      border: 1px solid rgba(34, 197, 94, 0.55);
      color: #dcfce7;
      padding: 6px 8px;
    }
    .item-card {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .edit-box {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
    }
    .muted { color: var(--muted); font-size: 0.88rem; }
    .hidden { display: none !important; }
    .sr-file {
      position: fixed;
      top: -100px;
      left: -100px;
      width: 1px;
      height: 1px;
      opacity: 0;
    }
    #status { font-size: 0.85rem; color: var(--accent); margin-top: 8px; min-height: 1.2em; word-break: break-word; }
  </style>
</head>
<body>
  <header>
    <h1>⚡ AI Katalog součástek</h1>
    <nav>
      <button id="tab-scan" class="active">Skenovat</button>
      <button id="tab-catalog">Katalog</button>
      <button id="tab-settings">Nastavení</button>
    </nav>
  </header>

  <main>
    <!-- ZÁLOŽKA 1: SKENOVÁNÍ -->
    <section id="view-scan">
      <div class="panel">
        <div class="row">
          <label for="file-camera" id="label-camera" class="btn-file primary">📷 Vyfotit součástku</label>
          <label for="file-gallery" id="label-gallery" class="btn-file">🖼️ Vybrat z galerie (více fotek)</label>
        </div>
        <input type="file" id="file-camera" accept="image/*" capture="environment" class="sr-file" />
        <input type="file" id="file-gallery" accept="image/*" multiple class="sr-file" />

        <div id="preview-grid" class="preview-grid hidden"></div>

        <div class="actions" id="photo-batch-actions" style="margin-top:12px;">
          <button type="button" id="btn-analyze-photos" class="success hidden" style="flex:2;">🚀 Analyzovat fotky</button>
          <button type="button" id="btn-clear-photos" class="danger hidden" style="flex:1;">🗑️ Vymazat fotky</button>
        </div>

        <div class="manual-ai-box">
          <label class="field-label" style="margin-top:0;">Nebo zadej označení součástky textem (bez fotky)</label>
          <div class="row">
            <input id="manual-query-input" type="text" placeholder="např. BC327, IRLZ44N, NE555, 1N5819..." style="flex:2;" />
            <button type="button" id="btn-analyze-text" class="primary" style="flex:1;">🔍 Zjistit údaje přes AI</button>
          </div>
        </div>

        <div id="status"></div>
        <div class="actions">
          <button id="btn-retry" class="primary hidden">🔁 Zkusit analýzu znovu</button>
        </div>
      </div>

      <!-- VÝSLEDEK ANALÝZY + ROZHODNUTÍ -->
      <div id="result-panel" class="panel hidden">
        <div id="duplicate-alert" class="dup-alert hidden"></div>

        <span id="res-category-badge" class="cat-path"></span>
        <label class="field-label">Název / Označení</label>
        <input id="res-name" type="text" />

        <label class="field-label">Základní typ (např. Unipolární tranzistor MOSFET – N-kanál)</label>
        <input id="res-type" type="text" placeholder="např. Unipolární tranzistor (MOSFET) – N-kanál" />

        <div class="row">
          <div>
            <label class="field-label">Kategorie</label>
            <select id="res-category"></select>
          </div>
          <div>
            <label class="field-label">Počet kusů</label>
            <input id="res-qty" type="number" min="0" value="1" />
          </div>
          <div>
            <label class="field-label">Umístění (šuplík / box)</label>
            <input id="res-location" type="text" placeholder="např. Box A3 nebo Nezařazené" />
          </div>
        </div>

        <label class="field-label">Hodnoty, řízení (G/B), limity (Vin max) a pouzdro</label>
        <textarea id="res-params" rows="6"></textarea>

        <label class="field-label">Pinout</label>
        <textarea id="res-pinout" rows="3"></textarea>

        <label class="field-label">Nejčastější použití</label>
        <textarea id="res-usage" rows="2"></textarea>

        <label class="field-label">Vhodné náhrady / ekvivalenty</label>
        <textarea id="res-replacements" rows="2" placeholder="např. IRLZ44N, AO3400, 1N5819..."></textarea>

        <div class="actions">
          <button id="btn-merge-gh" class="warn hidden">➕ Přičíst k existující položce</button>
          <button id="btn-open-existing" class="sm hidden">👀 Zobrazit v katalogu</button>
          <button id="btn-save-gh" class="success">💾 Uložit do katalogu (GitHub)</button>
          <button id="btn-discard" class="danger">🗑️ Smazat / Zahodit</button>
        </div>
      </div>
    </section>

    <!-- ZÁLOŽKA 2: KATALOG -->
    <section id="view-catalog" class="hidden">
      <div class="panel">
        <div class="row">
          <div>
            <label class="field-label">Filtr kategorie</label>
            <select id="filter-category">
              <option value="ALL">Všechny kategorie</option>
            </select>
          </div>
          <div>
            <label class="field-label">Hledat v katalogu</label>
            <input id="search-catalog" type="search" placeholder="např. IRLZ44N, N-kanál, náhrada..." />
          </div>
        </div>
        <div class="actions">
          <button id="btn-refresh-gh">🔄 Načíst z GitHubu</button>
        </div>
        <div id="catalog-status" class="muted" style="margin-top:8px;"></div>
      </div>

      <div id="catalog-list"></div>
    </section>

    <!-- ZÁLOŽKA 3: NASTAVENÍ -->
    <section id="view-settings" class="hidden">
      <div class="panel">
        <h2>Nastavení API a GitHub úložiště</h2>
        <p class="muted">Údaje se ukládají lokálně v prohlížeči tohoto zařízení (localStorage).</p>

        <label class="field-label">Gemini API klíč</label>
        <input id="cfg-gemini-key" type="password" placeholder="AIza..." />

        <label class="field-label">Preferovaný Gemini model (první v řadě)</label>
        <input id="cfg-gemini-model" type="text" value="gemini-3.1-flash-lite" />

        <label class="field-label">GitHub Personal Access Token</label>
        <input id="cfg-gh-token" type="password" placeholder="ghp_... nebo github_pat_..." />

        <div class="row">
          <div>
            <label class="field-label">GitHub uživatel / organizace</label>
            <input id="cfg-gh-owner" type="text" placeholder="např. ElPinduska" />
          </div>
          <div>
            <label class="field-label">GitHub repozitář</label>
            <input id="cfg-gh-repo" type="text" placeholder="např. Vyhledavac-el.soucastek" />
          </div>
        </div>

        <div class="row">
          <div>
            <label class="field-label">Větev (branch)</label>
            <input id="cfg-gh-branch" type="text" value="main" />
          </div>
          <div>
            <label class="field-label">Cesta k JSON souboru v repozitáři</label>
            <input id="cfg-gh-path" type="text" value="data/katalog.json" />
          </div>
        </div>

        <div class="actions">
          <button id="btn-save-cfg" class="primary">Uložit nastavení</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const CATEGORIES = [
      "Tranzistory > Bipolární > NPN",
      "Tranzistory > Bipolární > PNP",
      "Tranzistory > Unipolární (MOSFET) > N-kanál",
      "Tranzistory > Unipolární (MOSFET) > P-kanál",
      "Kondenzátory > Normální",
      "Kondenzátory > Low ESR",
      "Kondenzátory > Keramické / Ostatní",
      "Diody > Univerzální",
      "Diody > Schottky",
      "Diody > Rychlé (Fast recovery)",
      "Diody > Zenerovy / Ostatní",
      "Varistory",
      "Triaky",
      "Tyristory",
      "Tlumivky",
      "LED diody",
      "LDO,stabilizátory",
      "Integrované obvody",
      "Bloky(ESP32,Arduina,nabíjení,měniče....",
      "Nezařazené"
    ];

    const DEFAULT_MODEL = "gemini-3.1-flash-lite";
    const FALLBACK_MODELS = [
      "gemini-3.1-flash-lite",
      "gemini-4-hydrogen",
      "gemini-3.8-flash"
    ];

    const CFG_KEY = "part_catalog_cfg_v1";
    let currentImages = []; // [{ base64, mimeType }]
    let lastTextQuery = "";
    let isAnalyzingNow = false;
    let catalogCache = [];
    let catalogFileSha = null;
    let editingItemId = null;
    let matchedExistingItem = null;
    let catalogQueue = Promise.resolve();
    let isCatalogBusy = false;

    const retryBtn = document.getElementById("btn-retry");
    const analyzePhotosBtn = document.getElementById("btn-analyze-photos");
    const clearPhotosBtn = document.getElementById("btn-clear-photos");
    const cameraLabel = document.getElementById("label-camera");
    const galleryLabel = document.getElementById("label-gallery");
    const previewGrid = document.getElementById("preview-grid");
    const dupAlertEl = document.getElementById("duplicate-alert");
    const mergeBtn = document.getElementById("btn-merge-gh");
    const openExistingBtn = document.getElementById("btn-open-existing");
    const saveGhBtn = document.getElementById("btn-save-gh");
    const manualQueryInput = document.getElementById("manual-query-input");
    const analyzeTextBtn = document.getElementById("btn-analyze-text");
    const resNameInput = document.getElementById("res-name");
    const resQtyInput = document.getElementById("res-qty");
    const resLocInput = document.getElementById("res-location");
    const resCatSelect = document.getElementById("res-category");
    const filterCatSelect = document.getElementById("filter-category");
    CATEGORIES.forEach(c => {
      resCatSelect.add(new Option(c, c));
      filterCatSelect.add(new Option(c, c));
    });

    const views = {
      scan: document.getElementById("view-scan"),
      catalog: document.getElementById("view-catalog"),
      settings: document.getElementById("view-settings")
    };

    function switchTab(tab, { skipCatalogLoad = false } = {}) {
      Object.keys(views).forEach(k => {
        views[k].classList.toggle("hidden", k !== tab);
        document.getElementById("tab-" + k).classList.toggle("active", k === tab);
      });
      if (tab === "catalog" && !skipCatalogLoad) loadCatalogFromGitHub();
      if (tab === "scan") ensureCatalogLoadedQuietly();
    }

    ["scan", "catalog", "settings"].forEach(tab => {
      document.getElementById("tab-" + tab).addEventListener("click", () => switchTab(tab));
    });

    function getConfig() {
      return JSON.parse(localStorage.getItem(CFG_KEY) || "{}");
    }
    function loadConfigToForm() {
      const cfg = getConfig();
      document.getElementById("cfg-gemini-key").value = cfg.geminiKey || "";
      document.getElementById("cfg-gemini-model").value = cfg.geminiModel || DEFAULT_MODEL;
      document.getElementById("cfg-gh-token").value = cfg.ghToken || "";
      document.getElementById("cfg-gh-owner").value = cfg.ghOwner || "";
      document.getElementById("cfg-gh-repo").value = cfg.ghRepo || "";
      document.getElementById("cfg-gh-branch").value = cfg.ghBranch || "main";
      document.getElementById("cfg-gh-path").value = cfg.ghPath || "data/katalog.json";
    }
    document.getElementById("btn-save-cfg").addEventListener("click", () => {
      const cfg = {
        geminiKey: document.getElementById("cfg-gemini-key").value.trim(),
        geminiModel: document.getElementById("cfg-gemini-model").value.trim() || DEFAULT_MODEL,
        ghToken: document.getElementById("cfg-gh-token").value.trim(),
        ghOwner: document.getElementById("cfg-gh-owner").value.trim(),
        ghRepo: document.getElementById("cfg-gh-repo").value.trim(),
        ghBranch: document.getElementById("cfg-gh-branch").value.trim() || "main",
        ghPath: document.getElementById("cfg-gh-path").value.trim() || "data/katalog.json"
      };
      localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
      alert("Nastavení uloženo.");
      ensureCatalogLoadedQuietly();
    });
    loadConfigToForm();
    ensureCatalogLoadedQuietly();

    ["file-camera", "file-gallery"].forEach(id => {
      document.getElementById(id).addEventListener("change", handleFileSelect);
    });

    function updatePhotoButtonsUi() {
      const count = currentImages.length;
      if (count > 0) {
        cameraLabel.textContent = `📷 Vyfotit další fotku (${count})`;
        galleryLabel.textContent = `🖼️ Přidat fotky z galerie (${count})`;
        analyzePhotosBtn.textContent = `🚀 Analyzovat fotky (${count} ks)`;
        analyzePhotosBtn.classList.remove("hidden");
        clearPhotosBtn.classList.remove("hidden");
      } else {
        cameraLabel.textContent = "📷 Vyfotit součástku";
        galleryLabel.textContent = "🖼️ Vybrat z galerie (více fotek)";
        analyzePhotosBtn.classList.add("hidden");
        clearPhotosBtn.classList.add("hidden");
      }
      renderPhotoPreviews();
    }

    function renderPhotoPreviews() {
      if (!currentImages.length) {
        previewGrid.innerHTML = "";
        previewGrid.classList.add("hidden");
        return;
      }
      previewGrid.classList.remove("hidden");
      previewGrid.innerHTML = currentImages.map((img, idx) => `
        <div class="preview-card">
          <button type="button" class="remove-photo-btn" title="Odebrat fotku ${idx + 1}" onclick="removePhotoAt(${idx})">×</button>
          <img src="data:${img.mimeType};base64,${img.base64}" alt="Fotka ${idx + 1}" />
          <div class="preview-caption">Fotka ${idx + 1}</div>
        </div>
      `).join("");
    }

    function removePhotoAt(idx) {
      if (idx < 0 || idx >= currentImages.length) return;
      currentImages.splice(idx, 1);
      updatePhotoButtonsUi();
      const statusEl = document.getElementById("status");
      if (currentImages.length > 0) {
        statusEl.textContent = `Připraveno ${currentImages.length} ${currentImages.length === 1 ? "fotka" : currentImages.length < 5 ? "fotky" : "fotek"}. Můžeš přidat další nebo kliknout na „Analyzovat fotky“.`;
      } else {
        retryBtn.classList.add("hidden");
        statusEl.textContent = "Všechny fotky byly odebrány.";
      }
    }

    clearPhotosBtn.addEventListener("click", () => {
      currentImages = [];
      updatePhotoButtonsUi();
      const statusEl = document.getElementById("status");
      retryBtn.classList.add("hidden");
      statusEl.textContent = "Fotky vymazány.";
    });

    async function triggerAnalysisForCurrentState(statusEl) {
      if (isAnalyzingNow) return;
      isAnalyzingNow = true;
      retryBtn.classList.add("hidden");
      analyzePhotosBtn.disabled = true;
      analyzeTextBtn.disabled = true;

      try {
        const payload = currentImages.length > 0
          ? { images: [...currentImages] }
          : { textQuery: lastTextQuery };
        const usedModel = await analyzePart(payload, statusEl);
        if (currentImages.length > 0) {

    function resizeImageToBase64(file, maxDim, quality) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > maxDim || height > maxDim) {
              if (width > height) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL("image/jpeg", quality);
            resolve({ base64: dataUrl.split(",")[1] });
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function callSingleModel(model, apiKey, parts, statusEl) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;
      const retryDelays = [1500, 3500];
      let res;
      let lastErrorText = "";

      for (let attempt = 0; attempt <= retryDelays.length; attempt++) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 30000);

        try {
          res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            signal: controller.signal,
            body: JSON.stringify({
              generationConfig: {
                responseMimeType: "application/json"
              },
              contents: [{ parts }]
            })
          });
        } catch (netErr) {
          clearTimeout(timer);
          throw new Error(netErr.name === "AbortError" ? "Timeout (30 s)" : netErr.message);
        } finally {
          clearTimeout(timer);
        }

        if (res.ok) break;

        lastErrorText = await res.text();
        if (res.status === 503 && attempt < retryDelays.length) {
          const waitMs = retryDelays[attempt];
          if (statusEl) {
            statusEl.textContent = `Model ${model} hlásí 503, zkouším ho znovu za ${waitMs / 1000} s...`;
          }
          await sleep(waitMs);
          continue;
        }

        throw new Error(`HTTP ${res.status}: ${lastErrorText}`);
      }

      const data = await res.json();
      const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
      const cleaned = rawText.replace(/```json|```/g, "").trim();
      return JSON.parse(cleaned);
    }

    function normalizePartKey(str) {
      return String(str || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]/g, "");
    }

    function extractPartTokens(str) {
      const norm = String(str || "")
        .toUpperCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
      const rawTokens = norm.match(/[A-Z]{1,6}\d{1,6}[A-Z0-9-]{0,8}|\d{3,6}[A-Z]{0,5}/g) || [];
      return [...new Set(rawTokens.map(t => t.replace(/[^A-Z0-9]/g, "")).filter(t => t.length >= 3))];
    }

    function extractCoreCode(token) {
      // Např. IRLML2502TRPBF -> IRLML2502, BC547B -> BC547, AMS111733 -> AMS1117
      const m = String(token || "").match(/^([A-Z]{1,6}\d{2,6})/);
      return m ? m[1] : token;
    }

    function findCatalogMatches(name, typeText = "", paramsText = "") {
      const targetKey = normalizePartKey(name);
      const targetTokens = extractPartTokens(name);
      const targetCores = [...new Set(targetTokens.map(extractCoreCode).filter(c => c.length >= 4))];
      const combinedQuery = `${name} ${typeText} ${paramsText}`.toLowerCase();

      const scored = [];

      for (const item of catalogCache) {
        const itemKey = normalizePartKey(item.name);
        const itemTokens = extractPartTokens(`${item.name} ${item.type || ""}`);
        const itemCores = [...new Set(itemTokens.map(extractCoreCode).filter(c => c.length >= 4))];
        const itemHaystack = `${item.name} ${item.type || ""} ${item.params || ""}`.toLowerCase();

        let score = 0;

        if (targetKey && itemKey && targetKey === itemKey) {
          score = 100;
        } else if (
          targetKey.length >= 3 &&
          itemKey.length >= 3 &&
          (itemKey.startsWith(targetKey) || targetKey.startsWith(itemKey))
        ) {
          score = 85;
        } else if (targetTokens.some(t => itemTokens.includes(t))) {
          score = 80;
        } else if (targetCores.some(c => itemCores.includes(c) || itemKey.includes(c.toLowerCase()))) {
          score = 65;
        } else if (targetTokens.some(t => t.length >= 4 && itemHaystack.includes(t.toLowerCase()))) {
          score = 55;
        } else if (
          itemTokens.some(t => t.length >= 4 && combinedQuery.includes(t.toLowerCase()))
        ) {
          score = 50;
        }

        if (score > 0) {
          scored.push({ item, score });
        }
      }

      scored.sort((a, b) => b.score - a.score);
      return scored;
    }

    function findMatchingCatalogItem(name, typeText = "", paramsText = "") {
      const matches = findCatalogMatches(name, typeText, paramsText);
      return matches.length ? matches[0].item : null;
    }

    function ghHeaders(token) {
      return {
        "Authorization": `Bearer ${token}`,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      };
    }

    function encodeUtf8ToBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = "";
      bytes.forEach(b => bin += String.fromCharCode(b));
      return btoa(bin);
    }

    function decodeBase64ToUtf8(b64) {
      const bin = atob(b64.replace(/\n/g, ""));
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    }

    function setBusyState(busy) {

    function enqueueCatalogTask(taskFn) {
      catalogQueue = catalogQueue.then(async () => {
        setBusyState(true);
        renderCatalog();
        try {
          return await taskFn();
        } finally {
          setBusyState(false);
          renderCatalog();
        }
      });
      return catalogQueue;
    }

    async function fetchLatestCatalog(cfg) {
      const getUrl = `https://api.github.com/repos/${cfg.ghOwner}/${cfg.ghRepo}/contents/${cfg.ghPath}?ref=${cfg.ghBranch}&_=${Date.now()}`;
      const getRes = await fetch(getUrl, {
        cache: "no-store",
        headers: ghHeaders(cfg.ghToken)
      });
      if (getRes.ok) {
        const gJson = await getRes.json();
        catalogFileSha = gJson.sha;
        catalogCache = JSON.parse(decodeBase64ToUtf8(gJson.content));
        return true;
      }
      if (getRes.status === 404) {
        catalogFileSha = null;
        catalogCache = [];
        return true;
      }
      throw new Error(`Chyba čtení z GitHubu (${getRes.status}).`);
    }

    async function saveCatalogWithConflictRetry(cfg, mutateFn, maxRetries = 4) {
      for (let attempt = 0; attempt <= maxRetries; attempt++) {
        if (!catalogFileSha || attempt > 0) {
          await fetchLatestCatalog(cfg);
        }

        const commitMessage = mutateFn();
        const putBody = {
          message: commitMessage,
          content: encodeUtf8ToBase64(JSON.stringify(catalogCache, null, 2)),
          branch: cfg.ghBranch
        };
        if (catalogFileSha) putBody.sha = catalogFileSha;

        const putRes = await fetch(`https://api.github.com/repos/${cfg.ghOwner}/${cfg.ghRepo}/contents/${cfg.ghPath}`, {
          method: "PUT",
          headers: ghHeaders(cfg.ghToken),
          body: JSON.stringify(putBody)
        });

        if (putRes.ok) {
          const putJson = await putRes.json();
          catalogFileSha = putJson.content.sha;
          return;
        }

        const errTxt = await putRes.text();
        if (putRes.status === 409 && attempt < maxRetries) {
          await sleep(250 * (attempt + 1));
          await fetchLatestCatalog(cfg);
          continue;
        }

        throw new Error(`GitHub zápis selhal (${putRes.status}): ${errTxt}`);
      }
    }

          openExistingBtn.classList.add("hidden");
          document.getElementById("result-panel").classList.add("hidden");
        } catch (err) {
          statusEl.textContent = "Chyba přičítání: " + err.message;
        }
      });
    });

    saveGhBtn.addEventListener("click", async () => {
      return enqueueCatalogTask(async () => {
        const cfg = getConfig();
        const statusEl = document.getElementById("status");
        try {
          if (!cfg.ghToken || !cfg.ghOwner || !cfg.ghRepo) {
            throw new Error("Vyplň údaje ke GitHubu v Nastavení.");
          }
          const partName = resNameInput.value.trim();
          if (!partName) {
            resNameInput.focus();
            throw new Error("Vyplň prosím Název / Označení součástky.");
          }

          statusEl.textContent = "Ukládám do katalogu na GitHub...";

          const newItem = {
            id: Date.now(),
            addedAt: new Date().toISOString().slice(0, 10),
            name: partName,
            type: document.getElementById("res-type").value.trim(),
            category: resCatSelect.value,
            qty: Math.max(0, Number(resQtyInput.value) || 0),
            location: resLocInput.value.trim(),
            params: document.getElementById("res-params").value.trim(),
            pinout: document.getElementById("res-pinout").value.trim(),
            usage: document.getElementById("res-usage").value.trim(),
            replacements: document.getElementById("res-replacements").value.trim()
          };

          await saveCatalogWithConflictRetry(cfg, () => {
            catalogCache.unshift(newItem);
            return `Přidána součástka: ${newItem.name}`;
          });

          statusEl.textContent = `Uloženo do kategorie „${newItem.category}“ na GitHubu!`;
          matchedExistingItem = null;
          lastTextQuery = "";
          manualQueryInput.value = "";
          currentImages = [];
          updatePhotoButtonsUi();
          dupAlertEl.classList.add("hidden");
          mergeBtn.classList.add("hidden");
          openExistingBtn.classList.add("hidden");
          document.getElementById("result-panel").classList.add("hidden");
        } catch (err) {
          statusEl.textContent = "Chyba ukládání: " + err.message;
        }
      });
    });

    async function adjustItemQty(itemId, delta) {
      return enqueueCatalogTask(async () => {
        const cfg = getConfig();
        const catStatus = document.getElementById("catalog-status");
        if (!cfg.ghToken || !cfg.ghOwner || !cfg.ghRepo) {
          catStatus.textContent = "Vyplň údaje ke GitHubu v Nastavení.";
          return;
        }
        catStatus.textContent = "Aktualizuji počet kusů na GitHubu...";
        try {
          let finalName = "";
          let nextQty = 0;

          await saveCatalogWithConflictRetry(cfg, () => {
            const idx = catalogCache.findIndex(x => String(x.id) === String(itemId));
            if (idx === -1) throw new Error("Položka v katalogu nenalezena.");
            nextQty = Math.max(0, (Number(catalogCache[idx].qty) || 0) + delta);
            catalogCache[idx].qty = nextQty;
            finalName = catalogCache[idx].name;
            return `Změna počtu kusů (${finalName}): ${nextQty} ks`;
          });

          catStatus.textContent = `Uloženo: ${finalName} má nyní ${nextQty} ks.`;
        } catch (err) {
          catStatus.textContent = err.message;
        }
      });
    }

    async function deleteItem(itemId) {
      const target = catalogCache.find(x => String(x.id) === String(itemId));
      if (!confirm(`Opravdu smazat součástku „${target?.name || ""}“ z katalogu?`)) return;

      return enqueueCatalogTask(async () => {
        const cfg = getConfig();
        const catStatus = document.getElementById("catalog-status");
        if (!cfg.ghToken || !cfg.ghOwner || !cfg.ghRepo) {
          catStatus.textContent = "Vyplň údaje ke GitHubu v Nastavení.";
          return;
        }
        catStatus.textContent = "Mažu položku z GitHubu...";
        try {
          await saveCatalogWithConflictRetry(cfg, () => {
            catalogCache = catalogCache.filter(x => String(x.id) !== String(itemId));
            if (String(editingItemId) === String(itemId)) editingItemId = null;
            return `Smazána součástka: ${target?.name || itemId}`;
          });

          catStatus.textContent = "Položka smazána.";
        } catch (err) {
          catStatus.textContent = err.message;
        }
      });
    }

    async function saveEditedItem(itemId) {
      const nameVal = document.getElementById(`edit-name-${itemId}`).value.trim();
      const typeVal = document.getElementById(`edit-type-${itemId}`).value.trim();
      const catVal = document.getElementById(`edit-cat-${itemId}`).value;
      const qtyVal = Math.max(0, Number(document.getElementById(`edit-qty-${itemId}`).value) || 0);
      const locVal = document.getElementById(`edit-loc-${itemId}`).value.trim();
      const paramsVal = document.getElementById(`edit-params-${itemId}`).value.trim();
      const usageVal = document.getElementById(`edit-usage-${itemId}`).value.trim();
      const replVal = document.getElementById(`edit-repl-${itemId}`).value.trim();

      return enqueueCatalogTask(async () => {
        const cfg = getConfig();
        const catStatus = document.getElementById("catalog-status");
        if (!cfg.ghToken || !cfg.ghOwner || !cfg.ghRepo) {
          catStatus.textContent = "Vyplň údaje ke GitHubu v Nastavení.";
          return;
        }
        catStatus.textContent = "Ukládám úpravy na GitHub...";
        try {
          let finalName = "";

          await saveCatalogWithConflictRetry(cfg, () => {
            const idx = catalogCache.findIndex(x => String(x.id) === String(itemId));
            if (idx === -1) throw new Error("Položka v katalogu nenalezena.");
            catalogCache[idx] = {
              ...catalogCache[idx],
              name: nameVal || catalogCache[idx].name,
              type: typeVal,
              category: catVal,
              qty: qtyVal,
              location: locVal,
              params: paramsVal,
              usage: usageVal,
              replacements: replVal
            };
            finalName = catalogCache[idx].name;
            return `Úprava součástky: ${finalName}`;
          });

          editingItemId = null;
          catStatus.textContent = `Uloženy změny u „${finalName}“ (${qtyVal} ks, ${catVal}).`;
        } catch (err) {
          catStatus.textContent = err.message;
        }
      });
    }

    function buildCategoryOptionsHtml(selectedCategory) {
      const opts = [...new Set([...CATEGORIES, selectedCategory].filter(Boolean))];
      return opts.map(c => `<option value="${escapeHtml(c)}" ${c === selectedCategory ? "selected" : ""}>${escapeHtml(c)}</option>`).join("");
    }

    function renderCatalog() {
      const listEl = document.getElementById("catalog-list");
      const selectedCat = filterCatSelect.value;
      const query = document.getElementById("search-catalog").value.trim().toLowerCase();

      const filtered = catalogCache
        .map(item => {
          const matchCat = selectedCat === "ALL" || item.category === selectedCat;
          const replText = formatReplacements(item.replacements);
          const replMatch = Boolean(query) && replText.toLowerCase().includes(query);
          const haystack = `${item.name} ${item.type || ""} ${item.category} ${item.params} ${item.usage} ${replText} ${item.location}`.toLowerCase();
          const matchQuery = !query || haystack.includes(query);
          return { item, replText, replMatch, visible: matchCat && matchQuery };
        })
        .filter(entry => entry.visible);

      if (!filtered.length) {
        listEl.innerHTML = `<div class="panel muted">Žádné součástky neodpovídají filtru.</div>`;
        return;
      }

      listEl.innerHTML = filtered.map(({ item, replText, replMatch }) => {
        const isEditing = String(editingItemId) === String(item.id);
        const disAttr = isCatalogBusy ? "disabled" : "";
        return `
        <div class="item-card">
          <span class="cat-path">${escapeHtml(item.category)}</span>
          ${replMatch ? `<span class="repl-badge">🔁 Shoda v náhradách</span>` : ""}
          <div><strong>${escapeHtml(item.name)}</strong> — <span class="muted">${Number(item.qty) || 0} ks${item.location ? ` · ${escapeHtml(item.location)}` : ""} · ${item.addedAt || ""}</span></div>
          ${item.type ? `<div style="margin-top:6px;"><strong>Základní typ:</strong> ${escapeHtml(item.type)}</div>` : ""}
          ${item.params ? `<div class="params-text"><strong>Parametry:</strong>\n${escapeHtml(item.params)}</div>` : ""}
          ${item.pinout ? `<pre class="pinout" style="margin-top:6px;">${escapeHtml(item.pinout)}</pre>` : ""}
          ${item.usage ? `<div class="muted" style="margin-top:4px;"><strong>Použití:</strong> ${escapeHtml(item.usage)}</div>` : ""}
          ${replText ? `<div class="repl-box ${replMatch ? "highlighted" : ""}"><strong>Náhrady:</strong> ${escapeHtml(replText)}</div>` : ""}

          <div class="item-actions">
            <button class="sm" ${disAttr} onclick="adjustItemQty('${item.id}', -1)">-1 ks</button>
            <button class="sm" ${disAttr} onclick="adjustItemQty('${item.id}', 1)">+1 ks</button>
            <button class="sm primary" ${disAttr} onclick="toggleEditItem('${item.id}')">${isEditing ? "Zavřít úpravy" : "✏️ Upravit"}</button>
            <button class="sm danger" ${disAttr} onclick="deleteItem('${item.id}')">🗑️ Smazat</button>
          </div>

          ${isEditing ? `
            <div class="edit-box">
              <label class="field-label">Název / Označení</label>
              <input id="edit-name-${item.id}" type="text" value="${escapeHtml(item.name)}" />

              <label class="field-label">Základní typ</label>
              <input id="edit-type-${item.id}" type="text" value="${escapeHtml(item.type || "")}" />

              <div class="row">
                <div>
                  <label class="field-label">Kategorie</label>
                  <select id="edit-cat-${item.id}">${buildCategoryOptionsHtml(item.category)}</select>
                </div>
                <div>
                  <label class="field-label">Počet kusů</label>
                  <input id="edit-qty-${item.id}" type="number" min="0" value="${Number(item.qty) || 0}" />
                </div>
                <div>
                  <label class="field-label">Umístění</label>
                  <input id="edit-loc-${item.id}" type="text" value="${escapeHtml(item.location || "")}" />
                </div>
              </div>

              <label class="field-label">Parametry</label>
              <textarea id="edit-params-${item.id}" rows="5">${escapeHtml(item.params || "")}</textarea>

              <label class="field-label">Použití</label>
              <textarea id="edit-usage-${item.id}" rows="2">${escapeHtml(item.usage || "")}</textarea>

              <label class="field-label">Náhrady / ekvivalenty</label>
              <textarea id="edit-repl-${item.id}" rows="2">${escapeHtml(replText)}</textarea>

              <div class="item-actions">
                <button class="sm success" ${disAttr} onclick="saveEditedItem('${item.id}')">💾 Uložit změny</button>
                <button class="sm" ${disAttr} onclick="toggleEditItem(null)">Zrušit</button>
              </div>
            </div>
          ` : ""}
        </div>
      `;
      }).join("");
    }

    function toggleEditItem(itemId) {
      editingItemId = itemId;
      renderCatalog();
    }

    function escapeHtml(s) {
      return String(s || "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }

    document.getElementById("btn-refresh-gh").addEventListener("click", loadCatalogFromGitHub);
    filterCatSelect.addEventListener("change", renderCatalog);
    document.getElementById("search-catalog").addEventListener("input", renderCatalog);
  </script>
</body>
</html>
